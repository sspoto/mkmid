<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11161F" media="(prefers-color-scheme: dark)">
<title>MARK5320 Mid-Term Practice</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
<style>
:root{
  --page:#F2F4F7; --surface:#FFFFFF; --ink:#18202C; --muted:#5A6577; --line:#D7DDE6;
  --accent:#2747B8; --accent-ink:#FFFFFF; --accent-soft:#E6EBFA;
  --right:#1D7348; --right-soft:#E3F2EA; --wrong:#B42318; --wrong-soft:#FBE9E7;
  --bubble:#FFFFFF;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#11161F; --surface:#1A212D; --ink:#E7ECF3; --muted:#9AA6B8; --line:#2E3746;
    --accent:#8FA6FF; --accent-ink:#0F1420; --accent-soft:#222C47;
    --right:#5BCB8E; --right-soft:#16301F; --wrong:#FF8A7A; --wrong-soft:#3A1D1A;
    --bubble:#1A212D; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#11161F; --surface:#1A212D; --ink:#E7ECF3; --muted:#9AA6B8; --line:#2E3746;
  --accent:#8FA6FF; --accent-ink:#0F1420; --accent-soft:#222C47;
  --right:#5BCB8E; --right-soft:#16301F; --wrong:#FF8A7A; --wrong-soft:#3A1D1A;
  --bubble:#1A212D; color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--page);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 48px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1{font-size:1.75rem;line-height:1.2;margin:8px 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 24px}
.testlist{display:grid;gap:10px}
.testbtn{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
  text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.testbtn strong{display:block;font-size:1.05rem}
.testbtn span span{color:var(--muted);font-size:.9rem}
.score-pill{flex:none;font-weight:600;font-size:.9rem;color:var(--accent);background:var(--accent-soft);
  border-radius:999px;padding:4px 10px;white-space:nowrap}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 0}
.toggle{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.95rem;margin-top:22px}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.note{color:var(--muted);font-size:.85rem;margin-top:28px}

/* quiz */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--page);padding:10px 0 8px;
  border-bottom:1px solid var(--line);margin:-20px -16px 16px;padding-left:16px;padding-right:16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--page)}
.topline{display:flex;align-items:center;justify-content:space-between;gap:8px}
.back{background:none;border:0;color:var(--accent);padding:6px 0;font-weight:600}
.tally{font-size:.9rem;color:var(--muted)}
.tally b{color:var(--ink)}
/* the answer sheet */
.sheet{display:grid;grid-template-columns:repeat(20,1fr);gap:4px;margin-top:8px}
.dot{aspect-ratio:1;border-radius:50%;border:1.5px solid var(--line);background:var(--bubble);padding:0;min-width:0}
.dot.cur{border-color:var(--accent);border-width:2.5px}
.dot.ok{background:var(--right);border-color:var(--right)}
.dot.no{background:var(--wrong);border-color:var(--wrong)}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:var(--muted);margin-bottom:6px}
.q{font-size:1.15rem;font-weight:600;line-height:1.4;margin:0 0 16px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);
  border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;min-height:52px}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);
  display:grid;place-items:center;font-size:.85rem;font-weight:700;color:var(--muted)}
.opt.ok{border-color:var(--right);background:var(--right-soft)}
.opt.ok .l{background:var(--right);border-color:var(--right);color:#fff}
.opt.no{border-color:var(--wrong);background:var(--wrong-soft)}
.opt.no .l{background:var(--wrong);border-color:var(--wrong);color:#fff}
.opt:disabled{cursor:default;color:var(--ink)}
.fb{margin-top:16px;padding:14px;border-radius:12px;background:var(--surface);border-left:4px solid var(--accent)}
.fb.ok{border-left-color:var(--right)} .fb.no{border-left-color:var(--wrong)}
.fb p{margin:4px 0 0}
.fb .verdict{font-weight:700}
.nav{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;border:0;border-radius:12px;padding:14px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
/* results */
.big{font-size:3.5rem;font-weight:800;line-height:1;margin:16px 0 4px;letter-spacing:-.02em}
table{width:100%;border-collapse:collapse;margin-top:18px;font-size:.95rem}
th,td{text-align:left;padding:9px 4px;border-bottom:1px solid var(--line)}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.weak{color:var(--wrong);font-weight:600}
@media (prefers-reduced-motion:no-preference){
  .fb{animation:rise .18s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script>
const DATA = {"course": "MARK5320 Mid-Term", "tests": [{"title": "Practice Test 1", "questions": [{"chapter": "Ch 1", "source": "Lecture: Principles intro", "question": "The instructor expanded the AMA definition of marketing by adding which ideas?", "options": ["Setting prices and managing distribution", "Selling and advertising to the mass market", "Manufacturing efficiency and cost control", "Identifying, and maintaining exchange relationships in an ever-changing world"], "answer": 3, "explanation": "The class version adds \"identifying\" (who we create for) and \"maintaining those exchange relationships, in an ever-changing world.\""}, {"chapter": "Ch 1", "source": "Lecture", "question": "A family's day at an amusement park mainly provides which type of value?", "options": ["Utilitarian value", "Functional value only", "Hedonic value", "Monetary value only"], "answer": 2, "explanation": "Hedonic value comes from the experience and emotions of consumption itself."}, {"chapter": "Ch 1", "source": "Lecture", "question": "Which belief defines a sales orientation?", "options": ["The firm should focus on its internal capabilities", "Sales come from customers' own decisions", "Products should serve both customers and society", "Aggressive selling will make people buy more, and high sales mean high profits"], "answer": 3, "explanation": "A sales orientation pushes existing products through aggressive selling."}, {"chapter": "Ch 1", "source": "Text p. 24", "question": "Which is one of the four components of holistic marketing in the text?", "options": ["Internal marketing", "Sales marketing", "Production marketing", "Transactional marketing"], "answer": 0, "explanation": "Holistic marketing's four components: relationship, integrated, internal, and performance marketing."}, {"chapter": "Ch 2", "source": "Lecture: Strategy Planning", "question": "A marketing strategy consists of:", "options": ["A SWOT analysis and a logo", "A product and a price", "A target market and a marketing mix", "A mission statement and a budget"], "answer": 2, "explanation": "Target market + marketing mix = marketing strategy."}, {"chapter": "Ch 2", "source": "Lecture", "question": "In the five-step strategy planning model, SWOT analysis takes place in:", "options": ["Step 1, business mission", "Step 5, evaluate performance", "Step 3, identify opportunities", "Step 2, situation analysis"], "answer": 3, "explanation": "Step 2 is situation analysis (SWOT); Step 3 is segmentation, targeting, positioning."}, {"chapter": "Ch 2", "source": "Lecture", "question": "In a SWOT analysis, strengths and weaknesses are:", "options": ["Internal factors the firm controls", "Government regulations", "Competitors' advantages", "External factors in the environment"], "answer": 0, "explanation": "Strengths and weaknesses are internal; opportunities and threats are external."}, {"chapter": "Ch 2", "source": "Lecture", "question": "Starbucks transforming coffee from a commodity into an experience is an example of:", "options": ["A sustainable competitive advantage", "A production orientation", "A weakness in a SWOT", "A market penetration price cut"], "answer": 0, "explanation": "Lecture lists Starbucks, Harley-Davidson, and Apple as SCA examples."}, {"chapter": "Ch 2", "source": "Text p. 48", "question": "Which is NOT one of the text's seven marketing tactics?", "options": ["Distribution", "Incentives", "Segmentation", "Brand"], "answer": 2, "explanation": "The seven tactics: product, service, brand, price, incentives, communication, distribution."}, {"chapter": "Ch 3", "source": "Lecture: CB Intro", "question": "Which activity is part of the lecture's definition of consumer behavior?", "options": ["Manufacturing a product", "Setting a product's price", "Writing a firm's mission", "Disposing of a product"], "answer": 3, "explanation": "CB covers identifying, evaluating, selecting, obtaining, consuming, and disposing of offerings."}, {"chapter": "Ch 3", "source": "Lecture", "question": "Seeing a friend's new smartwatch makes you want one, though you have no need. This is:", "options": ["Routine response behavior", "Opportunity recognition: the ideal state rose", "Selective retention", "Problem recognition: the actual state dropped"], "answer": 1, "explanation": "Opportunities raise the desired state while the actual state stays the same."}, {"chapter": "Ch 3", "source": "Lecture", "question": "The theory of bounded rationality says consumers:", "options": ["Never use information when deciding", "Value gains more than equal losses", "Always choose the optimal option", "Have limits on their ability and capacity to process information"], "answer": 3, "explanation": "Limited processing capacity is why consumers use shortcuts."}, {"chapter": "Ch 3", "source": "Lecture + Text p. 74", "question": "Perception is the process by which people:", "options": ["Select, organize, and interpret information to create meaning", "Store information permanently", "Recall brand names", "Form purchase intentions"], "answer": 0, "explanation": "In marketing, perceptions matter more than reality because they drive behavior."}, {"chapter": "Ch 3", "source": "Lecture", "question": "Lecture defines learning as:", "options": ["Temporarily noticing an ad", "Forgetting old information", "Buying the same brand repeatedly", "A relatively permanent change in knowledge or behavior from processing external stimuli"], "answer": 3, "explanation": "Learning changes knowledge content, structure, or behavior."}, {"chapter": "Ch 3", "source": "Lecture", "question": "Groups such as teenagers or Southerners, whose values are similar to yet distinct from the broader culture, are:", "options": ["Market segments by definition", "Evoked sets", "Social classes", "Subcultures"], "answer": 3, "explanation": "Subcultures share values with, but differ from, the surrounding culture."}, {"chapter": "Ch 5", "source": "Lecture: Mktg Research", "question": "Marketing research (Lamb et al.) is defined as:", "options": ["Sizing a market only", "Advertising a product to a large audience", "The process of planning, collecting, and analyzing data relevant to a marketing decision", "Estimating a firm's tax obligations"], "answer": 2, "explanation": "Research supports decisions across every planning step."}, {"chapter": "Ch 5", "source": "Lecture", "question": "Secondary data is:", "options": ["Data that is always inaccurate", "Data from focus groups only", "Data that already exists, collected for another purpose", "Data collected specifically for the current problem"], "answer": 2, "explanation": "Check secondary data before paying for primary research."}, {"chapter": "Ch 5", "source": "Lecture", "question": "A focus group is an example of:", "options": ["Secondary data", "Big data analytics", "Quantitative research", "Qualitative research"], "answer": 3, "explanation": "Focus groups use open-ended discussion and probing."}, {"chapter": "Ch 5", "source": "Text p. 115", "question": "Which is NOT one of the research approaches listed in the text?", "options": ["Observational research", "Survey research", "Brand licensing", "Focus group research"], "answer": 2, "explanation": "Text approaches: observational, focus group, survey, behavioral (and experimental)."}, {"chapter": "Ch 5", "source": "Lecture", "question": "A generative adversarial network (GAN) works by:", "options": ["Surveying customers by phone", "Having a generator create data while a discriminator judges it against real data", "Ranking segments by profit", "Clustering customers into segments"], "answer": 1, "explanation": "The competition between the two networks improves output quality."}, {"chapter": "Ch 6", "source": "Lecture: STP", "question": "According to lecture, a market is:", "options": ["People with similar needs or wants who have the interest and ability to buy", "Any group of people in one city", "A store where products are sold", "All companies selling the same product"], "answer": 0, "explanation": "Both the need and the ability to buy are required."}, {"chapter": "Ch 6", "source": "Lecture", "question": "The first step in segmenting a product-market is to:", "options": ["Rank segments by profit", "Develop personas", "Select segmentation descriptors", "Define or select the market or product category"], "answer": 3, "explanation": "Steps: define the market, choose bases, select descriptors, analyze, rank."}, {"chapter": "Ch 6", "source": "Lecture", "question": "A segment defined by \"people who feel adventurous on weekends\" may fail which criterion, because members are hard to identify and measure?", "options": ["Substantial", "Heterogeneous", "Operational", "Profitable"], "answer": 2, "explanation": "Operational means you can identify members and measure the dimensions."}, {"chapter": "Ch 6", "source": "Lecture", "question": "Grouping toothpaste buyers into \"whitening seekers\" and \"cavity-prevention seekers\" uses:", "options": ["Geography", "Social class", "Benefits sought", "Household life cycle"], "answer": 2, "explanation": "Benefits sought is one of the four common bases."}, {"chapter": "Ch 6", "source": "Lecture", "question": "A firm develops a different marketing mix for each of three segments. This is:", "options": ["Concentrated targeting", "Combined targeting", "Undifferentiated targeting with one mix", "Multiple-segment targeting"], "answer": 3, "explanation": "A segmenter builds a separate mix for each segment."}, {"chapter": "Ch 7", "source": "Lecture", "question": "A brand's market position is:", "options": ["The brand's location on store shelves", "How customers actually perceive the brand relative to competitors", "The firm's intended image", "The brand's market share number"], "answer": 1, "explanation": "Market position lives in customers' minds; positioning strategy is the firm's plan."}, {"chapter": "Ch 7", "source": "Text p. 156", "question": "The same offering looks attractive next to an inferior product but unattractive next to a superior one. This shows the importance of:", "options": ["Market penetration", "Brand licensing", "Selective retention", "The frame of reference"], "answer": 3, "explanation": "Marketers choose a frame of reference that highlights their offering's value."}, {"chapter": "Ch 7", "source": "Text p. 157", "question": "Which is one of the text's three core strategies for standing out from competitors?", "options": ["Introducing a new attribute", "Reducing distribution", "Lowering product quality", "Copying the market leader"], "answer": 0, "explanation": "The three: differentiate on an existing attribute, introduce a new attribute, build a strong brand."}, {"chapter": "Ch 7", "source": "Lecture", "question": "On the lecture's MDS soap map, the size of each numbered circle represents:", "options": ["A brand's price", "The size of a customer segment", "The number of competitors", "A brand's advertising spend"], "answer": 1, "explanation": "Circles are segments' ideal points; larger circles are larger segments."}, {"chapter": "Ch 10", "source": "Lecture: Brand Intro", "question": "Lecture defines a brand primarily as:", "options": ["The company's legal name", "A product's price tier", "A product's physical packaging", "A perceived promise about a product"], "answer": 3, "explanation": "A brand is intangible: it provides and adds meaning and differentiates."}, {"chapter": "Ch 10", "source": "Lecture", "question": "Which is a benefit of branding from the company's point of view?", "options": ["Easier comparison shopping", "Legal protection", "Lower search costs", "Reduced perceived risk"], "answer": 1, "explanation": "Firms gain a price premium, competitive advantage, profits, and legal protection."}, {"chapter": "Ch 10", "source": "Lecture", "question": "Which is an intangible brand association?", "options": ["A $120 price", "A sense of personal achievement", "A shoebox design", "A rubber sole"], "answer": 1, "explanation": "Intangible associations include personality, values, and feelings."}, {"chapter": "Ch 10", "source": "Lecture", "question": "Which is NOT a condition favorable to branding?", "options": ["Favorable shelf or display space", "The product is hard to label and identify", "The market price can be high", "Dependable, widespread availability"], "answer": 1, "explanation": "Branding is favored when products are easy to label and identify."}, {"chapter": "Ch 10", "source": "Lecture", "question": "Which is one of the lecture's four ways of leveraging brand equity?", "options": ["Reducing distribution", "Cutting prices", "Changing the logo", "Brand licensing"], "answer": 3, "explanation": "Four ways: broadening distribution, family branding, brand extensions, brand licensing."}, {"chapter": "Ch 8/17/18", "source": "Text p. 161-162", "question": "Conformance quality refers to:", "options": ["How the product looks", "How long the product lasts", "How consistently each produced unit meets the promised specifications", "The product's price"], "answer": 2, "explanation": "Performance quality is how well primary characteristics work; conformance is consistency."}, {"chapter": "Ch 8/17/18", "source": "Text p. 166", "question": "A snack brand adds 10 new chip flavors to its existing chip line. This increases:", "options": ["Product mix width", "Diversification", "Product line depth", "Portfolio consistency"], "answer": 2, "explanation": "Depth is the number of variants within a line."}, {"chapter": "Ch 8/17/18", "source": "Standard framework", "question": "Life insurance that consumers don't actively seek is an example of a(n):", "options": ["Specialty product", "Shopping product", "Unsought product", "Convenience product"], "answer": 2, "explanation": "Unsought products need awareness-building and personal selling."}, {"chapter": "Ch 8/17/18", "source": "Lecture + Text p. 392", "question": "Which Ansoff strategy carries the highest risk?", "options": ["Product development", "Market penetration", "Market development", "Diversification"], "answer": 3, "explanation": "New products in new markets move furthest from what the firm knows."}, {"chapter": "Ch 8/17/18", "source": "Text p. 385", "question": "Which PLC stage has the largest number of competitors?", "options": ["Maturity", "Growth", "Decline", "Introduction"], "answer": 0, "explanation": "The text notes most products today are in maturity."}, {"chapter": "Ch 8/17/18", "source": "Text p. 414", "question": "Moore's model argues the largest adoption gap (the \"chasm\") lies between:", "options": ["The late majority and laggards", "Early adopters and the mainstream market", "Innovators and early adopters", "The early and late majority"], "answer": 1, "explanation": "Technology adoption is discontinuous, marked by gaps."}]}, {"title": "Practice Test 2", "questions": [{"chapter": "Ch 1", "source": "Lecture", "question": "According to lecture, what is the outcome of marketing?", "options": ["Mutually beneficial exchanges of value", "Maximized short-term sales volume", "Greater brand awareness", "Lower production costs"], "answer": 0, "explanation": "Marketing's outcome is an exchange where both parties gain something of value."}, {"chapter": "Ch 1", "source": "Lecture", "question": "Utilitarian value is the gratification derived from:", "options": ["Owning a well-known brand", "Solving a problem or accomplishing a task", "The emotions felt during consumption", "Showing status to others"], "answer": 1, "explanation": "Utilitarian value usually has a clearly rational explanation: the job got done."}, {"chapter": "Ch 1", "source": "Lecture", "question": "A firm that weighs people, planet, and profit (the triple bottom line) follows which philosophy?", "options": ["Production orientation", "Sales orientation", "Societal marketing orientation", "Market orientation only"], "answer": 2, "explanation": "Societal marketing extends the marketing concept to society's best interest."}, {"chapter": "Ch 1", "source": "Text p. 24", "question": "The text defines marketing management as the art and science of:", "options": ["Choosing target markets and getting, keeping, and growing customers through superior value", "Managing a company's financial assets", "Producing goods as efficiently as possible", "Maximizing advertising reach at the lowest cost"], "answer": 0, "explanation": "This definition centers on target markets and customer value over time."}, {"chapter": "Ch 2", "source": "Lecture", "question": "In lecture, price is defined as:", "options": ["Only the money paid at checkout", "Everything a buyer gives up (money, time, energy) in exchange for the product", "The cost of producing the product", "The amount the seller wants to earn"], "answer": 1, "explanation": "Price captures value; sacrifices include time and energy, not just money."}, {"chapter": "Ch 2", "source": "Lecture", "question": "Segmentation, targeting, and positioning happen in which step of strategy planning?", "options": ["Step 4, implement the marketing mix", "Step 3, identify opportunities", "Step 2, situation analysis", "Step 1, define the mission"], "answer": 1, "explanation": "STP identifies opportunities before the mix is designed."}, {"chapter": "Ch 2", "source": "Lecture", "question": "For a beef producer with no plant-based products, rising demand for plant-based food is best classified as a(n):", "options": ["Threat", "Weakness", "Opportunity it can't ignore because it's internal", "Strength"], "answer": 0, "explanation": "It's an external trend that works against the firm's current strengths. For a plant-based start-up, it would be an opportunity."}, {"chapter": "Ch 2", "source": "Lecture", "question": "Breakthrough opportunities help innovators:", "options": ["Avoid the need for a target market", "Develop strategies that are difficult to copy and stay profitable over time", "Reduce product quality", "Copy competitors more cheaply"], "answer": 1, "explanation": "Breakthrough (transformational) innovation can lead to a competitive advantage."}, {"chapter": "Ch 2", "source": "Text p. 33-34", "question": "In the text's 5-C framework, what sits at the center?", "options": ["The company", "Competitors", "Target customers", "Context"], "answer": 2, "explanation": "Target customers are at the center; company, collaborators, and competitors surround them; context forms the outer layer."}, {"chapter": "Ch 3", "source": "Lecture", "question": "Which is a general characteristic of consumer behavior?", "options": ["It can be influenced but not controlled", "It cannot be studied scientifically", "It never changes over time", "It can be fully controlled by marketers"], "answer": 0, "explanation": "CB can be understood, is dynamic, and can be influenced though not controlled."}, {"chapter": "Ch 3", "source": "Lecture", "question": "The relationship between product knowledge and amount of information search is shaped like an inverted U. Who searches the most?", "options": ["Consumers with moderate knowledge", "Expert consumers", "All consumers search equally", "Consumers with no knowledge"], "answer": 0, "explanation": "Moderate knowledge means knowing what to ask but not the answers."}, {"chapter": "Ch 3", "source": "Lecture", "question": "Prospect theory (Kahneman and Tversky) holds that:", "options": ["Price has no effect on choice", "Consumers always maximize utility", "Losses loom larger than equivalent gains", "Gains matter more than losses"], "answer": 2, "explanation": "Losing $20 feels worse than winning $20 feels good."}, {"chapter": "Ch 3", "source": "Text p. 62", "question": "A loyal Ford owner remembers praise for Ford and forgets praise for Toyota. This is:", "options": ["Selective attention", "Selective pricing", "Selective retention", "Selective exposure"], "answer": 2, "explanation": "People retain information that supports their attitudes and beliefs."}, {"chapter": "Ch 3", "source": "Text p. 74", "question": "The text describes short-term memory as:", "options": ["The same as perception", "A permanent, unlimited repository", "A set of brand associations", "A temporary and limited repository of information"], "answer": 3, "explanation": "Long-term memory is the more permanent, potentially unlimited repository."}, {"chapter": "Ch 3", "source": "Lecture", "question": "Purchase involvement refers to:", "options": ["How long a product lasts", "The number of stores a consumer visits", "The level of concern for, or interest in, the purchase process", "The price of the product only"], "answer": 2, "explanation": "Involvement reflects how important the purchase is to the consumer."}, {"chapter": "Ch 5", "source": "Lecture", "question": "The AMA describes marketing research as the function that links consumers to the marketer through:", "options": ["Advertising", "Pricing", "Information", "Distribution"], "answer": 2, "explanation": "Research links consumer, customer, and public to the marketer through information."}, {"chapter": "Ch 5", "source": "Lecture", "question": "Which is an internal source of secondary data?", "options": ["Government census data", "A trade association report", "A new customer survey", "Company sales records"], "answer": 3, "explanation": "Inside sources: company records, databases, sales and cost data, people."}, {"chapter": "Ch 5", "source": "Lecture", "question": "Researchers observing customers inside McDonald's restaurants were using:", "options": ["A mail survey", "Ethnography", "An experiment", "Secondary data"], "answer": 1, "explanation": "Ethnography observes people in their natural setting."}, {"chapter": "Ch 5", "source": "Text p. 115", "question": "Which is a contact method listed in the text?", "options": ["Perceptual mapping", "Brand extension", "Telephone", "Diversification"], "answer": 2, "explanation": "Contact methods: online, in person, mail or e-mail, telephone."}, {"chapter": "Ch 5", "source": "Lecture", "question": "Which best describes big data?", "options": ["Small, structured survey results", "Data collected by focus groups", "Only government census data", "Very large, fast-moving, varied data sets, often unstructured"], "answer": 3, "explanation": "Big data's volume, velocity, and variety require AI and analytics tools."}, {"chapter": "Ch 6", "source": "Lecture", "question": "A market segment is:", "options": ["A single customer", "A competitor's target market", "The firm's entire customer base", "A subgroup of people who share characteristics that give them similar product needs"], "answer": 3, "explanation": "Shared characteristics cause similar needs."}, {"chapter": "Ch 6", "source": "Lecture", "question": "Which is NOT part of the four-part product-market definition?", "options": ["Customer needs", "Geographic area", "Customer types", "Price level"], "answer": 3, "explanation": "The four parts: customer needs, customer types, geographic area, product type."}, {"chapter": "Ch 6", "source": "Lecture", "question": "A large, measurable segment that no media or channels can efficiently reach fails which criterion?", "options": ["Substantial", "Homogeneous within", "Operational", "Accessible"], "answer": 3, "explanation": "Accessible means you can actually reach the people."}, {"chapter": "Ch 6", "source": "Lecture", "question": "The household life cycle (HHLC) combines:", "options": ["Income, education, and occupation", "Age, marital status, and children", "Values, interests, and opinions", "Region, climate, and city size"], "answer": 1, "explanation": "Lecture notes the traditional HHLC is outdated: traditional married households fell from 72% to 47%."}, {"chapter": "Ch 6", "source": "Lecture", "question": "A combiner:", "options": ["Avoids segmentation entirely and serves no targets", "Creates a unique mix for each segment", "Aims at two or more segments with the same marketing mix", "Serves only one segment"], "answer": 2, "explanation": "Combiners save cost but risk satisfying no segment fully."}, {"chapter": "Ch 7", "source": "Text p. 156", "question": "The text defines positioning as:", "options": ["Choosing which factory makes the product", "Placing products on retail shelves", "Setting the lowest price in the market", "Designing an offering and image to occupy a distinctive place in target customers' minds"], "answer": 3, "explanation": "Positioning gives customers a reason to choose the offering."}, {"chapter": "Ch 7", "source": "Text p. 156", "question": "Points of difference are:", "options": ["Retail locations", "Attributes shared with competitors", "Ways to cut costs", "Attributes or benefits unique to the company's offering"], "answer": 3, "explanation": "PODs give customers a reason to choose the brand."}, {"chapter": "Ch 7", "source": "Lecture", "question": "In the lecture's positioning statement format, the \"because...\" clause provides:", "options": ["Reasons to believe", "The brand name", "The target market", "The product type"], "answer": 0, "explanation": "For (target), (brand) of all (product type) delivers (key benefit) because (reasons to believe)."}, {"chapter": "Ch 7", "source": "Lecture", "question": "A large segment's ideal point on a perceptual map has no brand near it. This most likely signals:", "options": ["That the segment doesn't exist", "A point of parity", "An unmet market opportunity", "A saturated market"], "answer": 2, "explanation": "Gaps between ideal points and brands suggest positioning or new-product opportunities."}, {"chapter": "Ch 10", "source": "Text p. 234", "question": "The text defines a brand as a name, term, sign, symbol, or design intended to:", "options": ["Set the product's price", "Reduce production costs", "Replace the need for promotion", "Identify a seller's goods and differentiate them from competitors'"], "answer": 3, "explanation": "The brand's purpose is value beyond the product itself."}, {"chapter": "Ch 10", "source": "Lecture", "question": "Brands are called \"sticky\" because:", "options": ["They are hard to remove from packaging", "Customers can't switch brands", "They never change", "Memory easily attaches associations to them"], "answer": 3, "explanation": "Brands are also \"stretchy\": they can be extended beyond the original application."}, {"chapter": "Ch 10", "source": "Text p. 64", "question": "The associative network memory model views long-term memory as:", "options": ["A single list of brand names", "Nodes of stored information connected by links of varying strength", "A set of prices", "A temporary storage area"], "answer": 1, "explanation": "Brand meaning is the network of associations surrounding the brand in memory."}, {"chapter": "Ch 10", "source": "Text p. 234", "question": "Which is NOT a criterion for effective brand elements in the text?", "options": ["Inexpensive", "Memorable", "Protectable", "Transferable"], "answer": 0, "explanation": "Criteria: memorable, meaningful, likable, transferable, adaptable, protectable."}, {"chapter": "Ch 10", "source": "Lecture", "question": "Nivea offering creams, lotions, sun care, and men's care under one name is:", "options": ["Ingredient branding", "Co-branding", "Brand licensing", "Family branding"], "answer": 3, "explanation": "Family branding groups related categories under one brand."}, {"chapter": "Ch 8/17/18", "source": "Text p. 161-162", "question": "A car accelerates beautifully but many units have electrical defects. It has:", "options": ["High conformance but low performance", "High durability", "High performance quality but poor conformance quality", "Strong points of parity"], "answer": 2, "explanation": "Quality has several dimensions and is ultimately judged by customers."}, {"chapter": "Ch 8/17/18", "source": "Text p. 176", "question": "A product line is:", "options": ["A group of related products sold by the same company", "One specific product variant", "A retailer's shelf layout", "All products a company sells"], "answer": 0, "explanation": "The product mix (portfolio) includes all lines."}, {"chapter": "Ch 8/17/18", "source": "Standard framework", "question": "Appliances compared carefully on price and features are shopping products. Which mix element fits best?", "options": ["Exclusive distribution in one store worldwide", "No promotion at all", "Selective distribution with comparison information and knowledgeable salespeople", "Distribution through every gas station"], "answer": 2, "explanation": "Shopping products are compared before purchase."}, {"chapter": "Ch 8/17/18", "source": "Lecture", "question": "On the GE planning grid, a business with high industry attractiveness and strong business strength should usually:", "options": ["Be divested", "Be ignored", "Be harvested for cash", "Invest and grow"], "answer": 3, "explanation": "The green zone signals investment."}, {"chapter": "Ch 8/17/18", "source": "Text p. 385", "question": "A recommended product strategy in the decline stage is to:", "options": ["Develop line extensions aggressively", "Use penetration pricing", "Offer a basic product", "Phase out weak products"], "answer": 3, "explanation": "Decline goals: reduce expenditure and harvest."}, {"chapter": "Ch 8/17/18", "source": "Text p. 385", "question": "According to the text's PLC table, which customers dominate the maturity stage?", "options": ["The mainstream (majority)", "Early adopters", "Laggards", "Innovators"], "answer": 0, "explanation": "Adopter groups map onto PLC stages: innovators in introduction, early adopters in growth, mainstream in maturity, laggards in decline."}]}, {"title": "Practice Test 3", "questions": [{"chapter": "Ch 1", "source": "Lecture", "question": "Which is NOT one of the four conditions for a mutually beneficial exchange?", "options": ["Both parties must be businesses", "Each party is willing to give up what it has to get what the other has", "There are two or more parties", "Each party has something of value"], "answer": 0, "explanation": "The four conditions: two or more parties, each with value, each willing to trade, and communication good enough to complete the exchange. Parties can be individuals."}, {"chapter": "Ch 1", "source": "Lecture", "question": "Trader Joe's narrow, high-quality assortment combined with an upbeat store atmosphere is an example of an offering that provides:", "options": ["Only hedonic value", "Neither, because it is a retailer", "Both utilitarian and hedonic value", "Only utilitarian value"], "answer": 2, "explanation": "Efficient shopping is utilitarian; the fun atmosphere is hedonic. The two are not mutually exclusive."}, {"chapter": "Ch 1", "source": "Lecture", "question": "Market orientation is described in lecture as:", "options": ["A focus on maximizing factory output", "The implementation of the marketing concept", "A synonym for sales orientation", "An approach that ignores competitors"], "answer": 1, "explanation": "Market orientation puts the marketing concept into action through market sensing and listening."}, {"chapter": "Ch 1", "source": "Lecture (Drucker)", "question": "Peter Drucker argued that a business has only two basic functions:", "options": ["Production and finance", "Advertising and distribution", "Sales and accounting", "Marketing and innovation"], "answer": 3, "explanation": "Drucker saw marketing as the whole business seen from the customer's point of view."}, {"chapter": "Ch 2", "source": "Lecture", "question": "Which P of the marketing mix is described as \"delivering value\"?", "options": ["Promotion", "Place", "Product", "Price"], "answer": 1, "explanation": "Place gets the product to the right customer, when and where they want it, at the expected cost."}, {"chapter": "Ch 2", "source": "Lecture", "question": "Evaluating performance with marketing metrics belongs to which phase?", "options": ["Implementation phase", "Control phase", "Mission phase", "Planning phase"], "answer": 1, "explanation": "Step 5, evaluating performance, is the control phase."}, {"chapter": "Ch 2", "source": "Lecture", "question": "According to lecture, a competitive advantage results from:", "options": ["Being the oldest firm in the industry", "Having the largest advertising budget", "A marketing mix the target market perceives as providing more value than competitors'", "Charging the highest price"], "answer": 2, "explanation": "Note the word \"perceives\": the advantage lives in customers' minds."}, {"chapter": "Ch 2", "source": "Text p. 31", "question": "Which is NOT a characteristic of a strategic business unit (SBU)?", "options": ["It shares one marketing mix with every other unit", "It can exist separately from the rest of the company", "It has a manager responsible for strategy and profit", "It has its own set of competitors"], "answer": 0, "explanation": "An SBU is a separable business with its own competitors and an accountable manager."}, {"chapter": "Ch 2", "source": "Text p. 34", "question": "In the 5-C framework, collaborators are:", "options": ["The firm's own employees only", "Firms aiming to fill the same needs of the same customers", "Government regulators", "Entities that work with the company to create value for target customers"], "answer": 3, "explanation": "Collaborators supply complementary resources the company lacks, like suppliers and distributors."}, {"chapter": "Ch 3", "source": "Lecture + Text p. 65", "question": "What is the correct order of the consumer purchase decision process?", "options": ["Need recognition, purchase, information search, evaluation, post-purchase", "Evaluation, need recognition, search, purchase, post-purchase", "Need recognition, information search, evaluation of alternatives, purchase, post-purchase", "Information search, need recognition, purchase, evaluation, post-purchase"], "answer": 2, "explanation": "The classic five steps, though real consumers may skip or reverse stages."}, {"chapter": "Ch 3", "source": "Lecture", "question": "Why do experts typically search for little information before buying?", "options": ["They cannot afford to search", "They already know what they need from memory", "They rely only on advertising", "They are low-involvement buyers"], "answer": 1, "explanation": "High prior knowledge means internal search is enough."}, {"chapter": "Ch 3", "source": "Lecture", "question": "\"People satisfice rather than optimize\" means consumers:", "options": ["Buy the most expensive option", "Always find the single best option", "Choose an option that is good enough", "Avoid making decisions"], "answer": 2, "explanation": "Satisficing is settling on an acceptable choice."}, {"chapter": "Ch 3", "source": "Text p. 62", "question": "A consumer interprets a neutral review of her favorite brand as positive. This illustrates:", "options": ["Selective retention", "Brand insistence", "Selective distortion", "Selective attention"], "answer": 2, "explanation": "Selective distortion bends information to fit what we already believe."}, {"chapter": "Ch 3", "source": "Text p. 74", "question": "According to the text, which factor exerts the broadest and deepest influence on consumer behavior?", "options": ["Packaging", "Price", "Personal factors", "Cultural factors"], "answer": 3, "explanation": "The text groups influences as cultural, social, and personal; culture is broadest and deepest."}, {"chapter": "Ch 3", "source": "Text p. 71", "question": "A shopper worries friends will laugh at her new jacket. Which perceived risk is this?", "options": ["Physical risk", "Social risk", "Financial risk", "Functional risk"], "answer": 1, "explanation": "Social risk is the fear of embarrassment in front of others."}, {"chapter": "Ch 5", "source": "Text p. 115", "question": "The text's marketing research process begins with:", "options": ["Defining the problem", "Analyzing the data", "Collecting information", "Making the decision"], "answer": 0, "explanation": "Define the problem, develop the plan, collect, analyze, then decide."}, {"chapter": "Ch 5", "source": "Lecture", "question": "Which is an example of primary data?", "options": ["Results of a survey the firm designs for the current question", "Government statistics", "A library database article", "Industry analyst reports"], "answer": 0, "explanation": "Primary data is collected for the specific problem at hand."}, {"chapter": "Ch 5", "source": "Lecture", "question": "A key advantage of quantitative research is that it:", "options": ["Always costs less than qualitative research", "Provides rich, in-depth explanations of motives", "Can represent the target population and test hypotheses", "Requires no structured questions"], "answer": 2, "explanation": "Quantitative results can be generalized and support prediction."}, {"chapter": "Ch 5", "source": "Lecture", "question": "Unsupervised machine learning:", "options": ["Finds hidden patterns, such as clusters, without being given answers", "Requires labeled training data with correct answers", "Cannot be used for segmentation", "Only works with surveys"], "answer": 0, "explanation": "Clustering is unsupervised learning and maps naturally to segmentation."}, {"chapter": "Ch 5", "source": "Lecture", "question": "Market research (as opposed to marketing research) is a process used to:", "options": ["Set employee salaries", "Design advertising creative", "Define the size, location, and makeup of a market", "Make every marketing decision"], "answer": 2, "explanation": "Marketing research is broader: a scientific process for business decisions."}, {"chapter": "Ch 6", "source": "Lecture", "question": "Market segmentation divides a market into groups based on their similarity in:", "options": ["Spelling of their names", "Responding to a particular marketing mix", "Physical appearance", "Distance from the firm's headquarters only"], "answer": 1, "explanation": "Segmentation lets marketers tailor mixes."}, {"chapter": "Ch 6", "source": "Lecture", "question": "\"Homogeneous within\" means:", "options": ["People in a segment respond similarly to a marketing mix", "Segments are as different from each other as possible", "The segment can be reached through media", "Each segment is large"], "answer": 0, "explanation": "Homogeneity within is the first criterion of good segments."}, {"chapter": "Ch 6", "source": "Lecture", "question": "Which is a demographic segmentation variable?", "options": ["Household income", "Lifestyle interests", "Brand loyalty", "Benefits sought"], "answer": 0, "explanation": "Demographics are observable population statistics."}, {"chapter": "Ch 6", "source": "Lecture", "question": "In step 4 of segmentation, marketers:", "options": ["Analyze segments and develop personas", "Choose segmentation bases", "Define the product category", "Set the advertising budget"], "answer": 0, "explanation": "Step 4 looks at size, growth, brand usage, loyalty, frequency, and profit potential."}, {"chapter": "Ch 6", "source": "Text p. 136", "question": "In the text, target compatibility refers to:", "options": ["How cheaply ads can reach a segment", "Customers' potential to create value for the company", "The company's ability to create superior value for the target customers", "How similar two segments are"], "answer": 2, "explanation": "Compatibility depends on resources like infrastructure, skills, brands, and capital."}, {"chapter": "Ch 7", "source": "Text p. 156", "question": "The value proposition consists of:", "options": ["A single slogan", "The whole cluster of benefits (and costs) the company promises to deliver", "The firm's mission statement", "Only the product's price"], "answer": 1, "explanation": "The value proposition is broad; positioning is focused."}, {"chapter": "Ch 7", "source": "Text p. 156", "question": "Points of parity are:", "options": ["Attributes no competitor has", "The brand's logo and colors", "Price discounts", "Attributes or benefits the offering shares with competitors"], "answer": 3, "explanation": "PODs differentiate; points of parity neutralize competitors' advantages."}, {"chapter": "Ch 7", "source": "Lecture", "question": "In Mountain Dew's positioning statement, \"16-24-year-old males who embrace excitement, adventure, and fun\" is the:", "options": ["Reason to believe", "Target market", "Point of parity", "Product type"], "answer": 1, "explanation": "The statement opens with the target market."}, {"chapter": "Ch 7", "source": "Lecture", "question": "Multidimensional scaling is used in positioning to assess a brand's:", "options": ["Legal protection", "Production costs", "Distribution coverage", "Perceived positioning"], "answer": 3, "explanation": "Lecture: use MDS to assess \"perceived\" positioning."}, {"chapter": "Ch 10", "source": "Lecture", "question": "The fundamental principle of successful brand development, per lecture, is that a brand:", "options": ["Matters only for luxury goods", "Should be changed every year", "Transforms a product into something larger than the product", "Hides a product's weaknesses"], "answer": 2, "explanation": "Not misleading, just larger: Coke is much more than a soft drink."}, {"chapter": "Ch 10", "source": "Lecture (Keller)", "question": "Keller says each brand association should be:", "options": ["Desirable, deliverable, and differentiable", "Cheap, simple, and fast", "Large, growing, and profitable", "Strong, relevant, and unique"], "answer": 3, "explanation": "Strong, relevant, unique associations build brand image."}, {"chapter": "Ch 10", "source": "Text p. 64", "question": "Seeing a WNBA star in a TV ad brings Nike to mind. This happens because:", "options": ["Selective distortion blocks the ad", "Short-term memory is unlimited", "The ad replaced older memories", "Activation spreads from one node to strongly linked nodes"], "answer": 3, "explanation": "Spreading activation explains how stimuli trigger brand recall."}, {"chapter": "Ch 10", "source": "Text p. 213", "question": "The text defines brand power (customer-based brand equity) as:", "options": ["The brand's share of total advertising", "The number of products under the brand", "The differential effect brand knowledge has on consumer response to the brand's marketing", "The physical assets of the brand owner"], "answer": 2, "explanation": "Positive power means consumers react more favorably when the brand is identified."}, {"chapter": "Ch 10", "source": "Lecture", "question": "Arm & Hammer moving from baking soda into cat litter is a:", "options": ["Point of parity", "Brand extension", "Co-brand", "Family brand only"], "answer": 1, "explanation": "An extension uses an established brand in a different category."}, {"chapter": "Ch 8/17/18", "source": "Text p. 176", "question": "Which is NOT one of the text's attributes for product differentiation?", "options": ["Reliability", "Customization", "Form", "Price"], "answer": 3, "explanation": "Attributes: core functionality, features, performance and conformance quality, durability, reliability, form, style, customization."}, {"chapter": "Ch 8/17/18", "source": "Text Ch. 8-9", "question": "On the goods-services continuum, which is closest to a pure tangible good?", "options": ["Legal advice", "Salt", "A haircut", "An airline flight"], "answer": 1, "explanation": "Offerings range from pure goods to pure services by their tangible share."}, {"chapter": "Ch 8/17/18", "source": "Lecture + Text p. 392", "question": "Selling more of an existing product to current customers is:", "options": ["Market development", "Product development", "Diversification", "Market penetration"], "answer": 3, "explanation": "Present product, present market: the lowest-risk Ansoff cell."}, {"chapter": "Ch 8/17/18", "source": "Lecture", "question": "On the GE grid, a business low on both attractiveness and strength falls in the zone that suggests:", "options": ["Doubling the ad budget", "Diversifying into it", "Aggressive investment", "Harvesting or divesting"], "answer": 3, "explanation": "The red zone signals harvest or divest."}, {"chapter": "Ch 8/17/18", "source": "Text p. 385", "question": "Arm & Hammer promoting baking soda as a refrigerator deodorizer is a way to:", "options": ["Extend the product life cycle by finding new uses", "Begin the introduction stage", "Practice ingredient branding", "Create a point of parity"], "answer": 0, "explanation": "New uses, new users, and more frequent use extend the PLC."}, {"chapter": "Ch 8/17/18", "source": "Text p. 378", "question": "Which is a source of market-pioneer advantage in the text?", "options": ["Customers prefer switching brands often", "Pioneers never face larger competitors", "The pioneer's brand establishes what attributes the category should have", "Pioneers always have the lowest costs"], "answer": 2, "explanation": "Early users recall the pioneer, and customer inertia helps it."}]}, {"title": "Practice Test 4", "questions": [{"chapter": "Ch 1", "source": "Lecture", "question": "Customer value is best described as:", "options": ["The relationship between benefits received and sacrifices made to obtain them", "The price printed on the product", "The cost to the firm of producing the product", "The number of features a product offers"], "answer": 0, "explanation": "Value is a personal net assessment: benefits versus sacrifices (money, time, energy)."}, {"chapter": "Ch 1", "source": "Lecture + Text p. 15", "question": "The three components of the marketing concept are:", "options": ["Segmentation, targeting, and positioning", "Product, price, and promotion", "Customer needs and wants, a company-wide effort, and long-term profitability", "Production, sales, and distribution"], "answer": 2, "explanation": "The instructor's short version: a company-wide effort to satisfy customers, for a profit (or another organizational goal)."}, {"chapter": "Ch 1", "source": "Text p. 6-9", "question": "The text identifies four major market forces shaping today's business environment. They are:", "options": ["Company, collaborators, competitors, and context", "Product, price, place, and promotion", "Political, economic, social, and legal factors", "Technology, globalization, the physical environment, and social responsibility"], "answer": 3, "explanation": "Figure 1.3 lists these four forces, which produce new consumer capabilities, new company capabilities, and a new competitive environment."}, {"chapter": "Ch 1", "source": "Lecture", "question": "Lecture claims marketing accounts for a large share of final prices, yet:", "options": ["Marketing reduces prices overall", "Marketing has no effect on prices", "Marketing only matters to large firms", "Marketing should be cut to lower prices"], "answer": 0, "explanation": "Marketing makes markets more efficient and competitive, which lowers prices."}, {"chapter": "Ch 2", "source": "Lecture", "question": "Promotion is communication that:", "options": ["Manages warehouses and shipping", "Designs the physical product", "Informs, persuades, and/or reminds buyers to influence opinions or elicit a response", "Sets the final price of a product"], "answer": 2, "explanation": "Promotion communicates value."}, {"chapter": "Ch 2", "source": "Lecture", "question": "A marketing plan equals:", "options": ["A marketing strategy plus time- and budget-related details", "A marketing mix minus the target market", "A firm's mission statement", "A collection of advertisements"], "answer": 0, "explanation": "Several marketing plans together make up the firm's marketing program."}, {"chapter": "Ch 2", "source": "Lecture", "question": "A sustainable competitive advantage is one that:", "options": ["Exists only during a product launch", "Lasts over a significant period of time", "Is gained by cutting prices", "Is guaranteed by patents only"], "answer": 1, "explanation": "Many advantages are easily copied; sustainable ones endure."}, {"chapter": "Ch 2", "source": "Text p. 48", "question": "The text says strategic planning takes place at three levels:", "options": ["Short-term, medium-term, and long-term", "Corporate, business unit, and market offering", "Local, national, and global", "Product, price, and place"], "answer": 1, "explanation": "Corporate strategy frames the plans of business units and individual offerings."}, {"chapter": "Ch 2", "source": "Text p. 49", "question": "The purpose of a marketing audit is to:", "options": ["Replace the marketing plan entirely", "Identify overlooked opportunities and problem areas and recommend improvements", "Calculate the company's taxes", "Design the company logo"], "answer": 1, "explanation": "Periodic audits keep the marketing plan effective."}, {"chapter": "Ch 3", "source": "Lecture", "question": "The evoked (consideration) set is:", "options": ["Every brand in the product category", "The group of brands a buyer will choose from after information search", "The ads a consumer remembers", "The brands a consumer has rejected"], "answer": 1, "explanation": "Search narrows options to the evoked set."}, {"chapter": "Ch 3", "source": "Lecture", "question": "Lecture calls which stage the perfect time for marketing interventions?", "options": ["Evaluation of alternatives", "Need recognition", "Post-purchase disposal", "Product consumption"], "answer": 0, "explanation": "Consumers are comparing options in the evoked set on utilitarian and hedonic value."}, {"chapter": "Ch 3", "source": "Lecture + Text p. 65", "question": "How does the consumer decision journey differ from the traditional five-step process?", "options": ["It requires consumers to follow every step in order", "It assumes consumers never use technology", "It compresses the evoked set and evaluation steps and adds a feedback loop", "It eliminates the purchase step"], "answer": 2, "explanation": "Technology gives consumers information and feedback power; the journey isn't linear."}, {"chapter": "Ch 3", "source": "Text p. 74", "question": "According to the text, a need becomes a motive when:", "options": ["It is shared by a reference group", "It is aroused to a sufficient level of intensity to drive action", "A brand advertises it", "It is recorded in memory"], "answer": 1, "explanation": "Motivation g a competitive advantage from new technology?", "options": ["Late majority", "Laggards", "Innovators", "Early adopters"], "answer": 3, "explanation": "Early adopters influence others, making them strategically valuable."}, {"chapter": "Ch 8/17/18", "source": "Text p. 414", "question": "The text's stage-gate new-offering process runs in which order?", "options": ["Business analysis, test marketing, idea generation, screening, launch", "Idea generation, concept development, business-model design, offering development, commercial deployment", "Concept development, idea generation, commercialization, test marketing, screening", "Commercialization, idea generation, concept testing, business analysis, screening"], "answer": 1, "explanation": "Gates between stages validate the work before more is invested."}]}]};
const KEY = "mark5320-quiz-v1";
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { store = {}; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }

const app = document.getElementById("app");
let S = null; // current session

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function home(){
  S = null;
  const rows = DATA.tests.map((t,i) => {
    const best = store["best"+i];
    return `<button class="testbtn" data-t="${i}"><span><strong>${esc(t.title)}</strong><span>${t.questions.length} questions, all chapters</span></span>${best!=null?`<span class="score-pill">Best ${best}/${t.questions.length}</span>`:""}</button>`;
  }).join("");
  const missed = (store.missed||[]).length;
  app.innerHTML = `
    <h1>MARK5320 Mid-Term Practice</h1>
    <p class="sub">Five tests of 40 questions covering Chapters 1-3, 5-8, 10, and 17. Tap an answer to see whether it's right and why.</p>
    <div class="testlist">${rows}
      <button class="testbtn" data-t="missed" ${missed?"":"disabled"} style="${missed?"":"opacity:.5"}"><span><strong>Review missed questions</strong><span>${missed?`${missed} question${missed>1?"s":""} you got wrong`:"Nothing missed yet"}</span></span></button>
    </div>
    <label class="toggle"><input type="checkbox" id="shuf" ${store.shuffle?"checked":""}> Shuffle question order</label>
    <p class="note">Progress and scores are saved on this device only.</p>`;
  app.querySelectorAll(".testbtn").forEach(b => b.onclick = () => start(b.dataset.t));
  document.getElementById("shuf").onchange = e => { store.shuffle = e.target.checked; save(); };
  window.scrollTo(0,0);
}

function start(t){
  let qs, title;
  if (t === "missed"){
    qs = (store.missed||[]).map(id => { const [a,b]=id.split("-").map(Number); return {...DATA.tests[a].questions[b], id}; });
    title = "Missed questions";
  } else {
    const i = +t; title = DATA.tests[i].title;
    qs = DATA.tests[i].questions.map((q,j) => ({...q, id:`${i}-${j}`}));
  }
  if (store.shuffle){ for (let i=qs.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [qs[i],qs[j]]=[qs[j],qs[i]]; } }
  S = {t, title, qs, picks: Array(qs.length).fill(null), at: 0};
  draw();
}

function draw(){
  const q = S.qs[S.at], pick = S.picks[S.at], done = pick !== null;
  const right = S.picks.filter((p,i) => p!==null && p===S.qs[i].answer).length;
  const answered = S.picks.filter(p => p!==null).length;
  const dots = S.qs.map((x,i) => {
    const p = S.picks[i]; const c = p===null ? "" : (p===x.answer ? "ok" : "no");
    return `<button class="dot ${c} ${i===S.at?"cur":""}" data-i="${i}" aria-label="Question ${i+1}${p===null?"":(p===x.answer?", correct":", incorrect")}"></button>`;
  }).join("");
  const L = "ABCD";
  const opts = q.options.map((o,k) => {
    let c = ""; if (done){ if (k===q.answer) c="ok"; else if (k===pick) c="no"; }
    return `<button class="opt ${c}" data-k="${k}" ${done?"disabled":""}><span class="l">${L[k]}</span><span>${esc(o)}</span></button>`;
  }).join("");
  const fb = done ? `<div class="fb ${pick===q.answer?"ok":"no"}" aria-live="polite"><span class="verdict">${pick===q.answer?"Correct.":`Not quite. The answer is ${L[q.answer]}.`}</span><p>${esc(q.explanation)}</p></div>` : "";
  const last = S.at === S.qs.length-1;
  app.innerHTML = `
    <div class="topbar">
      <div class="topline"><button class="back" id="back">Tests</button><span class="tally"><b>${right}</b> right of ${answered} answered</span></div>
      <div class="sheet" role="group" aria-label="Answer sheet">${dots}</div>
    </div>
    <div class="meta"><span>Question ${S.at+1} of ${S.qs.length}</span><span>${esc(q.chapter)}  |  ${esc(q.source)}</span></div>
    <p class="q">${esc(q.question)}</p>
    <div class="opts">${opts}</div>
    ${fb}
    <div class="nav">
      <button class="btn ghost" id="prev" ${S.at===0?"disabled":""}>Previous</button>
      <button class="btn" id="next">${last ? "See results" : "Next"}</button>
    </div>`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.k));
  app.querySelectorAll(".dot").forEach(b => b.onclick = () => { S.at = +b.dataset.i; draw(); });
  document.getElementById("back").onclick = home;
  document.getElementById("prev").onclick = () => { S.at--; draw(); window.scrollTo(0,0); };
  document.getElementById("next").onclick = () => { if (last) results(); else { S.at++; draw(); window.scrollTo(0,0); } };
}

function answer(k){
  S.picks[S.at] = k;
  const q = S.qs[S.at]; const m = new Set(store.missed||[]);
  if (k === q.answer) { if (S.t==="missed") m.delete(q.id); } else m.add(q.id);
  store.missed = [...m]; save(); draw();
}

function results(){
  const n = S.qs.length;
  const right = S.picks.filter((p,i) => p===S.qs[i].answer).length;
  const skipped = S.picks.filter(p => p===null).length;
  if (S.t !== "missed"){ const k="best"+S.t; if (store[k]==null || right>store[k]) store[k]=right; save(); }
  const by = {};
  S.qs.forEach((q,i) => { const c = by[q.chapter] ||= {n:0,r:0}; c.n++; if (S.picks[i]===q.answer) c.r++; });
  const rows = Object.entries(by).map(([ch,c]) => `<tr><td class="${c.r/c.n<0.7?"weak":""}">${esc(ch)}</td><td class="n">${c.r} / ${c.n}</td></tr>`).join("");
  app.innerHTML = `
    <button class="back" id="back">Tests</button>
    <h1>${esc(S.title)}</h1>
    <div class="big">${Math.round(right/n*100)}%</div>
    <p class="sub">${right} of ${n} correct${skipped?`, ${skipped} skipped`:""}. Chapters in red scored under 70%: restudy those in your guide first.</p>
    <table><thead><tr><th>Chapter</th><th class="n">Score</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="nav"><button class="btn ghost" id="again">Retake</button><button class="btn" id="home">All tests</button></div>`;
  document.getElementById("back").onclick = home;
  document.getElementById("home").onclick = home;
  document.getElementById("again").onclick = () => start(S.t);
  window.scrollTo(0,0);
}
home();
</script>
</body>
